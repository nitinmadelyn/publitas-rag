# Render Blueprint (https://render.com/docs/blueprint-spec) for the
# cheapest viable demo deployment: this API service on Render's free
# plan, backed by an external Supabase Postgres (Supabase's own free
# tier already ships with the pgvector extension available, so it's not
# duplicated here as a Render-managed Postgres instance).
#
# Deploy: push this repo to GitHub, then in the Render dashboard use
# "New +" -> "Blueprint" and point it at the repo. Render reads this
# file and creates the service below; secrets marked `sync: false` are
# then filled in once via the Render dashboard (never committed here).
services:
  - type: web
    name: publitas-rag-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /healthz

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: LOG_LEVEL
        value: info

      # Supabase connection string (Project Settings -> Database ->
      # Connection string -> URI, "Transaction" pooler mode recommended
      # for a service that opens many short-lived connections). Must
      # include ?sslmode=require - Supabase requires TLS.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        # Render's free plan is a single small instance; Supabase's free
        # tier also caps total concurrent connections low, so this stays
        # well under that cap rather than using the 10-connection local
        # default. Re-tune with the Phase 9 load test harness against
        # your actual Supabase plan's connection limit before raising it.
        value: 5

      - key: PUBLITAS_API_BASE_URL
        value: https://api.publitas.com/v1

      - key: OPENAI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false

      # Comma-separated list; generate real random keys per consumer
      # rather than using the local dev default here.
      - key: API_KEYS
        sync: false
      - key: RATE_LIMIT_MAX
        value: 60
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      # Public read-only demo: any site can embed the chat widget. Narrow
      # this to specific origins once this is more than a demo.
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
